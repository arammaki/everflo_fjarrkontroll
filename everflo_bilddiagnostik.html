<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolldetektor — EverFlo</title>
<style>
:root{
  --panel:#15181c; --panel2:#1d2228; --line:#2b323a;
  --ink:#e7eaed; --dim:#8c959f; --faint:#5b656f;
  --signal:#f2b134; --ok:#4fa89f; --alert:#e2564a;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%}
body{padding:18px 16px 40px;max-width:620px;margin:0 auto}
h1{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 2px}
.sub{font-size:12px;color:var(--faint);margin:0 0 20px;font-family:var(--mono)}

.readout{display:grid;grid-template-columns:1fr 84px;gap:18px;align-items:stretch;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.value{font-family:var(--mono);font-size:64px;line-height:.95;font-weight:600;
  letter-spacing:-.03em;color:var(--signal);font-variant-numeric:tabular-nums}
.value.none{color:var(--alert);font-size:30px;letter-spacing:0;line-height:1.15}
.unit{font-family:var(--mono);font-size:15px;color:var(--dim);margin-top:8px}
.note{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.45}
.note strong{color:var(--ink);font-weight:600}

/* Signaturen: replik av röret så avläsningen kan jämföras med verkligheten */
.tube{position:relative;background:#0f1215;border:1px solid var(--line);border-radius:6px}
.tube canvas{display:block;width:100%;height:100%;border-radius:5px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.metric .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.metric .v{font-family:var(--mono);font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.metric.bad .v{color:var(--alert)} .metric.good .v{color:var(--ok)}

.controls{margin-top:22px;display:flex;flex-direction:column;gap:10px}
label.file{display:block;padding:14px;text-align:center;border:1px dashed var(--line);
  border-radius:8px;color:var(--dim);font-size:14px;cursor:pointer;background:var(--panel2)}
label.file:hover,label.file:focus-within{border-color:var(--signal);color:var(--ink)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.row{display:flex;gap:8px}
input[type=url]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:8px;padding:11px 12px;font-family:var(--mono);font-size:13px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:11px 16px;font-size:14px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
summary{font-size:12px;color:var(--faint);cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.diag{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.7;margin-top:10px}
.diag b{color:var(--ink);font-weight:500}
#profil{width:100%;height:120px;margin-top:12px;background:#0f1215;
  border:1px solid var(--line);border-radius:6px}
@media (prefers-reduced-motion:no-preference){
  .value{transition:color .18s ease}
}
</style>
</head>
<body>

<h1>Bolldetektor</h1>
<p class="sub">EverFlo · flödesavläsning ur bild</p>

<div class="readout">
  <div>
    <div class="value none" id="val">Ingen bild</div>
    <div class="unit" id="unit"></div>
    <div class="note" id="note">Läs in en bild från riggen för att börja.</div>
  </div>
  <div class="tube"><canvas id="tube" width="84" height="240"></canvas></div>
</div>

<div class="grid">
  <div class="metric" id="m-kontrast"><div class="k">Bollkontrast</div><div class="v">—</div></div>
  <div class="metric" id="m-marginal"><div class="k">Entydighet</div><div class="v">—</div></div>
  <div class="metric" id="m-reg"><div class="k">Bildpassning</div><div class="v">—</div></div>
  <div class="metric" id="m-skift"><div class="k">Kameraskift</div><div class="v">—</div></div>
</div>

<div class="controls">
  <label class="file">Välj eller ta en bild
    <input type="file" id="fil" accept="image/*">
  </label>
  <div class="row">
    <input type="url" id="url" placeholder="http://rigg.local/snapshot.jpg">
    <button id="hamta">Hämta</button>
  </div>
</div>

<details>
  <summary>Diagnostik</summary>
  <div class="diag" id="diag">Ingen körning än.</div>
  <canvas id="profil" width="600" height="120"></canvas>
</details>

/* ---------- bildhjälpare ---------- */
function toGray(imgData){
  const d=imgData.data, g=new Float32Array(W*H);
  for(let i=0,j=0;i<g.length;i++,j+=4)
    g[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];
  return g;
}
function boxH(src,dst,r){
  const win=2*r+1;
  for(let y=0;y<H;y++){
    const o=y*W; let sum=0;
    for(let x=-r;x<=r;x++) sum+=src[o+Math.min(W-1,Math.max(0,x))];
    for(let x=0;x<W;x++){
      dst[o+x]=sum/win;
      sum-=src[o+Math.min(W-1,Math.max(0,x-r))];
      sum+=src[o+Math.min(W-1,Math.max(0,x+r+1))];
    }
  }
}
function boxV(src,dst,r){
  const win=2*r+1;
  for(let x=0;x<W;x++){
    let sum=0;
    for(let y=-r;y<=r;y++) sum+=src[Math.min(H-1,Math.max(0,y))*W+x];
    for(let y=0;y<H;y++){
      dst[y*W+x]=sum/win;
      sum-=src[Math.min(H-1,Math.max(0,y-r))*W+x];
      sum+=src[Math.min(H-1,Math.max(0,y+r+1))*W+x];
    }
  }
}
function flatfield(g){
  const r=Math.floor(BOXW/2);
  let a=Float32Array.from(g), b=new Float32Array(W*H);
  for(let p=0;p<PASSES;p++){ boxH(a,b,r); boxV(b,a,r); }
  const out=new Float32Array(W*H);
  for(let i=0;i<out.length;i++) out[i]=g[i]/Math.max(a[i],1e-6);
  return out;
}
function bandProfile(ff,x1,x2){
  const p=new Float32Array(H), n=x2-x1;
  for(let y=0;y<H;y++){ let s=0; for(let x=x1;x<x2;x++) s+=ff[y*W+x]; p[y]=s/n; }
  return p;
}
function centre(p){ let m=0; for(const v of p) m+=v; m/=p.length;
  const q=new Float32Array(p.length); for(let i=0;i<p.length;i++) q[i]=p[i]-m; return q; }
function smooth(p,w){
  const r=(w-1)/2, out=new Float32Array(p.length);
  for(let i=0;i<p.length;i++){ let s=0;
    for(let k=-r;k<=r;k++) s+=p[Math.min(p.length-1,Math.max(0,i+k))];
    out[i]=s/w; }
  return out;
}

/* ---------- referensbild ---------- */
let REF=null;
function loadRef(){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=W; c.height=H;
      const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(im,0,0,W,H);
      const ff=flatfield(toGray(x.getImageData(0,0,W,H)));
      REF={ff, ball:bandProfile(ff,XL,XR), anchor:centre(bandProfile(ff,AX1,AX2))};
      res();
    };
    im.src=REF_PNG;
  });
}

/* ---------- analys ---------- */
function analysera(imgData){
  const ff=flatfield(toGray(imgData));
  const anchor=centre(bandProfile(ff,AX1,AX2));

  // vertikal registrering: korskorrelation mot referensens skalstreck
  let best=-1e18, bi=0; const vals={};
  for(let dy=-25;dy<=25;dy++){
    let s=0;
    for(let y=40;y<600;y++){
      const j=y+dy; if(j<0||j>=H) continue;
      s+=anchor[j]*REF.anchor[y];
    }
    vals[dy]=s; if(s>best){best=s; bi=dy;}
  }
  let na=0,nr=0;
  for(let y=40;y<600;y++){ na+=anchor[y]*anchor[y]; nr+=REF.anchor[y]*REF.anchor[y]; }
  const reg=best/(Math.sqrt(na*nr)+1e-9);
  let dy=bi;
  if(vals[bi-1]!==undefined&&vals[bi+1]!==undefined){
    const den=vals[bi-1]-2*vals[bi]+vals[bi+1];
    if(Math.abs(den)>1e-9) dy=bi-0.5*(vals[bi+1]-vals[bi-1])/den;
  }

  // differensprofil, skiftkompenserad
  const pf=bandProfile(ff,XL,XR);
  let d=new Float32Array(H);
  for(let y=0;y<H;y++){
    const s=y+dy, i0=Math.floor(s), f=s-i0;
    const a=pf[Math.min(H-1,Math.max(0,i0))], b=pf[Math.min(H-1,Math.max(0,i0+1))];
    d[y]=Math.max(0, REF.ball[y]-(a*(1-f)+b*f));
  }
  d=smooth(d,21);
  for(let y=0;y<H;y++) if(y<YTOP||y>=YBOT) d[y]=0;

  let yp=0; for(let y=0;y<H;y++) if(d[y]>d[yp]) yp=y;
  const peak=d[yp];

  let sw=0, sy=0;
  for(let y=Math.max(0,yp-35);y<Math.min(H,yp+35);y++){
    const w=Math.max(0,d[y]-0.35*peak); sw+=w; sy+=w*y;
  }
  const ycog=sw>1e-9? sy/sw : yp;

  let p2=0; for(let y=0;y<H;y++) if(Math.abs(y-yp)>60 && d[y]>p2) p2=d[y];
  const marginal=peak/Math.max(p2,1e-9);

  let utbred=0; for(let y=0;y<H;y++) if(d[y]>0.3*peak) utbred++;

  const flode=CAL[0]*ycog*ycog + CAL[1]*ycog + CAL[2];
  return {y:ycog, peak, marginal, reg, dy, flode, utbred, profil:d};
}

/* ---------- bedömning ---------- */
function bedom(r){
  if(r.reg < T.reg)
    return {ok:false, rubrik:"Ingen avläsning",
            skal:"Bilden matchar inte referensen. Kontrollera att kameran ser röret och att inget skymmer sikten."};
  if(r.peak < T.kontrast)
    return {ok:false, rubrik:"Ingen avläsning",
            skal:"Bollen syns inte tillräckligt tydligt. Kan bero på imma, smuts på linsen eller för svag belysning."};
  if(r.marginal < T.marginal)
    return {ok:false, rubrik:"Osäker avläsning",
            skal:"Två lika starka kandidater i röret — går inte att avgöra vilken som är bollen."};
  if(r.utbred > T.utbred)
    return {ok:false, rubrik:"Osäker avläsning",
            skal:"Störningen i röret är för utbredd för att vara bollen. Kontrollera att inget hänger framför röret."};
  if(Math.abs(r.dy) > 20)
    return {ok:false, rubrik:"Ingen avläsning",
            skal:"Kameran har flyttat sig för mycket ("+r.dy.toFixed(0)+" px). Rikta om den eller gör om kalibreringen."};
  if(r.y < Y_MAX_STATE)
    return {ok:true, maxState:true, rubrik:null,
            skal:"Bollen står vid eller ovanför det övre tjocka strecket — flödet är över skalans sista siffra."};
  if(r.y > Y_KAL_MAX+12)
    return {ok:true, bottenState:true, rubrik:null,
            skal:"Bollen ligger vid eller nära botten — flödet är under 0,5 L/min eller avstängt."};
  if(r.y < Y_KAL_MIN-12 || r.y > Y_KAL_MAX+12)
    return {ok:true, extrapolerad:true, rubrik:null,
            skal:"Bollen står utanför det kalibrerade området — värdet är extrapolerat och mindre tillförlitligt."};
  return {ok:true, extrapolerad:false, rubrik:null,
          skal:"Inom kalibrerat område."};
}

/* ---------- rendering ---------- */
function ritaTub(r,giltig){
  const c=document.getElementById('tube'), g=c.getContext('2d');
  g.clearRect(0,0,84,240);
  g.strokeStyle="#2b323a"; g.lineWidth=1;
  g.strokeRect(20.5,10.5,43,220);
  g.fillStyle="#5b656f"; g.font="9px ui-monospace,monospace"; g.textAlign="right";
  // skalstreck 1..5 via kalibreringen (invertera y för varje heltalsflöde)
  for(let f=1;f<=5;f++){
    const a=CAL[0],b=CAL[1],cc=CAL[2]-f;
    const yy=(-b-Math.sqrt(Math.max(b*b-4*a*cc,0)))/(2*a);
    const py=10+ (yy-100)/(600-100)*220;
    if(py<10||py>230) continue;
    g.beginPath(); g.moveTo(20,py); g.lineTo(30,py); g.stroke();
    g.fillText(String(f),17,py+3);
  }
  if(giltig){
    const py=10+(r.y-100)/(600-100)*220;
    g.fillStyle="#f2b134"; g.beginPath(); g.arc(42,py,7,0,7); g.fill();
  }
}
function ritaProfil(d){
  const c=document.getElementById('profil'), g=c.getContext('2d');
  const w=c.width,h=c.height; g.clearRect(0,0,w,h);
  let mx=0; for(const v of d) if(v>mx) mx=v;
  g.strokeStyle="#f2b134"; g.lineWidth=1.5; g.beginPath();
  for(let y=0;y<H;y++){
    const X=y/H*w, Y=h-(d[y]/(mx||1))*(h-8)-4;
    y?g.lineTo(X,Y):g.moveTo(X,Y);
  }
  g.stroke();
}
function setMetric(id,txt,ok){
  const e=document.getElementById(id);
  e.querySelector('.v').textContent=txt;
  e.classList.toggle('bad',ok===false); e.classList.toggle('good',ok===true);
}

function visa(r){
  const b=bedom(r);
  const val=document.getElementById('val'), unit=document.getElementById('unit'),
        note=document.getElementById('note');
  if(!b.ok){
    val.className="value none"; val.textContent=b.rubrik; unit.textContent="";
    note.innerHTML=b.skal;
  }else if(b.bottenState){
    val.className="value none"; val.textContent="Under 0,5";
    unit.textContent="L/min — bollen i botten";
    note.innerHTML=b.skal;
  }else if(b.maxState){
    val.className="value"; val.textContent="Max";
    unit.textContent="över övre strecket";
    note.innerHTML=b.skal;
  }else{
    val.className="value"; val.textContent=r.flode.toFixed(1);
    unit.textContent="L/min";
    note.innerHTML=(b.extrapolerad?"<strong>Extrapolerat.</strong> ":"")+b.skal;
  }
  setMetric('m-kontrast',r.peak.toFixed(3), r.peak>=T.kontrast);
  setMetric('m-marginal',r.marginal.toFixed(2)+"×", r.marginal>=T.marginal);
  setMetric('m-reg',r.reg.toFixed(3), r.reg>=T.reg);
  setMetric('m-skift',r.dy.toFixed(1)+" px", Math.abs(r.dy)<=20);
  ritaTub(r,b.ok);
  ritaProfil(r.profil);
  document.getElementById('diag').innerHTML=
    "boll-y <b>"+r.y.toFixed(1)+"</b> px<br>"+
    "råflöde <b>"+r.flode.toFixed(3)+"</b> L/min<br>"+
    "utbredning <b>"+r.utbred+"</b> rader (gräns "+T.utbred+")<br>"+
    "kalibrerat y-intervall <b>"+Y_KAL_MIN+"–"+Y_KAL_MAX+"</b><br>"+
    "kalibrering <b>"+CAL.map(v=>v.toExponential(3)).join(", ")+"</b>";
}

/* ---------- inläsning ---------- */
function kor(src){
  const im=new Image(); im.crossOrigin="anonymous";
  im.onload=()=>{
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(im,0,0,W,H);
    visa(analysera(x.getImageData(0,0,W,H)));
  };
  im.onerror=()=>{
    document.getElementById('val').className="value none";
    document.getElementById('val').textContent="Bilden gick inte att läsa";
    document.getElementById('note').textContent="Kontrollera adressen eller filformatet.";
  };
  im.src=src;
}
document.getElementById('fil').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>kor(rd.result); rd.readAsDataURL(f);
});
document.getElementById('hamta').addEventListener('click',()=>{
  const u=document.getElementById('url').value.trim();
  if(u) kor(u+(u.includes('?')?'&':'?')+'t='+Date.now());
});

loadRef();
</script>
